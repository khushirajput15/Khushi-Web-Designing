<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment 4</title>
</head>
<body>
  <h1 align="center"> Hotel Room Booking</h1>
    <form action="a" align="center">
        <label for="Full Name">Full Name: </label>
        <input type="text" name="Full Name" Id="Full Name">
        <br><br>

        <label for="Email"> E-Mail: </label>
        <input type="email" name="Email" Id="Email">
        <br><br>

        <label for="Phone No."> Phone No.:</label>
        <input type="tel" name="Phone" Id="Phone">
        <br><br>

        <label for="Checkin">Check-in Date: </label>
        <input type="date" name="Checkin" Id="Checkin">
        <br> <br>

        <label for="CheckOut">Check-Out Date: </label>
        <input type="date" name="CheckOut" Id="CheckOut">
        <br><br>

        
        
        <label for="Room-type">Room Type: </label>
        <select name="Room-type" id="Room-type">
          <option value="single">Single</option>
          <option value="double">Double</option>
          <option value="luxury">Luxury</option>
          <option value="suite">Suite</option>
        </select>
        <br> <br>

        <label for="guest">No. Of Guests: </label>
        <input type="number" name="guest" Id="guest">
        <br><br>

        <label for="request">Special Request</label><br>
        <textarea name="request" Id="request" row="4" cols="40"></textarea>
        <br> <br>
        
        <button type="submit" value="Book Now">Book Now</button>
        <button type="submit" value="submit">Reset</button>
        

    </form>
</body>
</html>
